name: TinyPPI
options:
  bundleIdPrefix: nl.tinyppi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 19
    MARKETING_VERSION: 1.5.7
    DEVELOPMENT_TEAM: ""
targets:
  TinyPPI:
    type: application
    platform: iOS
    sources: [TinyPPI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.tinyppi.app
        PRODUCT_NAME: TinyPPI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TinyPPI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TinyPPI maakt verbinding met je CoreELEC- of Kodi-box op je lokale netwerk.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [TinyPPITests]
  TinyPPITests:
    type: bundle.unit-test
    platform: iOS
    sources: [TinyPPITests]
    dependencies:
      - target: TinyPPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.tinyppi.tests
        GENERATE_INFOPLIST_FILE: YES

